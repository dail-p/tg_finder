services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tg_finder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tg_finder}
      POSTGRES_DB: ${POSTGRES_DB:-tg_finder}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tg_finder}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_MODE: bot
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tg_finder}:${POSTGRES_PASSWORD:-tg_finder}@db:5432/${POSTGRES_DB:-tg_finder}
    restart: unless-stopped

  scheduler:
    build: .
    depends_on:
      db:
        condition: service_healthy
      bot:
        # start after bot has already applied migrations
        condition: service_started
    env_file: .env
    environment:
      APP_MODE: scheduler
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tg_finder}:${POSTGRES_PASSWORD:-tg_finder}@db:5432/${POSTGRES_DB:-tg_finder}
    restart: unless-stopped

volumes:
  pgdata:
