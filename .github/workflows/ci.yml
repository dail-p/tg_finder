name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tg_finder
          POSTGRES_PASSWORD: tg_finder
          POSTGRES_DB: tg_finder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg_finder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://tg_finder:tg_finder@localhost:5432/tg_finder

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src tests

      - name: Run migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest -q
